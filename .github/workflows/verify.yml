name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Built from pikelang/Pike tag v8.0.1116 — the version every command in these
  # skills was verified against.
  PIKE_SRC_VERSION: "8.0.1116"

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fast signal: Pike straight from apt.
          - name: Ubuntu (packaged Pike)
            distro: ubuntu
            container: ""
          # Rocky/RHEL do not package Pike at all and upstream ships source
          # tarballs only, so this one builds it. Cached per Pike version.
          - name: Rocky Linux 9 (source build)
            distro: rocky
            container: "rockylinux:9"

    steps:
      # Rocky's base image is minimal: tar/gzip are needed by actions/cache and
      # git by actions/checkout, so install them before either action runs.
      - name: Install base tools (Rocky)
        if: matrix.distro == 'rocky'
        run: dnf -y install tar gzip git diffutils m4 findutils

      - uses: actions/checkout@v4

      # ---------------------------------------------------------- Ubuntu path
      # pike8.0 alone omits the C-module tooling; `pike -x precompile` and
      # `pike -x module` live in pike8.0-dev.
      - name: Install Pike (Ubuntu)
        if: matrix.distro == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y pike8.0 pike8.0-dev m4

      # ----------------------------------------------------------- Rocky path
      - name: Cache Pike (Rocky)
        if: matrix.distro == 'rocky'
        id: cache-pike
        uses: actions/cache@v4
        with:
          path: /usr/local/pike
          key: pike-${{ env.PIKE_SRC_VERSION }}-rocky9

      - name: Install build dependencies (Rocky)
        if: matrix.distro == 'rocky' && steps.cache-pike.outputs.cache-hit != 'true'
        run: dnf -y install gcc gcc-c++ make gmp-devel nettle-devel zlib-devel

      # Built from the official release tarball for this exact version rather
      # than the matching git tag: a git checkout has no pre-generated
      # src/language.c_src or interpret_functions_fixed.h, so it needs bison
      # *and* an already-installed Pike to bootstrap itself. The tarball ships
      # both, which removes the chicken-and-egg problem on a distro with no
      # Pike package.
      - name: Build Pike from source (Rocky)
        if: matrix.distro == 'rocky' && steps.cache-pike.outputs.cache-hit != 'true'
        run: |
          set -eux
          cd /tmp
          curl -sL "https://pike.lysator.liu.se/pub/pike/all/${PIKE_SRC_VERSION}/Pike-v${PIKE_SRC_VERSION}.tar.gz" -o pike.tar.gz
          tar xzf pike.tar.gz
          cd "Pike-v${PIKE_SRC_VERSION}"
          make CONFIGUREARGS="--without-debug --without-bundles" -j"$(nproc)"
          make install

      # The /usr/local/bin/pike symlink lives outside the cached path, so it
      # has to be recreated on a cache hit as well as after a fresh build.
      - name: Put pike on PATH (Rocky)
        if: matrix.distro == 'rocky'
        run: ln -sf "/usr/local/pike/${PIKE_SRC_VERSION}/bin/pike" /usr/local/bin/pike

      # ------------------------------------------------------------- Both
      - name: Show Pike version and paths
        run: |
          pike --version
          pike --show-paths

      - name: Verify documented commands
        run: ./verify.sh
